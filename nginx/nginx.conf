events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Dashboard
        location / {
            proxy_pass http://dashboard:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Gateways
        location /api/auth/ {
            proxy_pass http://auth-service:8080/api/auth/;
            proxy_set_header Host $host;
        }

        location /api/orders/ {
            proxy_pass http://order-service:8080/api/orders/;
            proxy_set_header Host $host;
        }

        location /api/vehicles/ {
            proxy_pass http://vehicle-service:8080/api/vehicles/;
            proxy_set_header Host $host;
        }

        location /api/notifications/ {
            proxy_pass http://notification-service:8080/api/notifications/;
            proxy_set_header Host $host;
        }

        location /api/reports/ {
            proxy_pass http://report-service:8080/api/reports/;
            proxy_set_header Host $host;
        }

        location /api/consolidation/ {
            proxy_pass http://consolidation-service:8080/api/consolidation/;
            proxy_set_header Host $host;
        }
    }
}
