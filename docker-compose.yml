services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${DB_PASSWORD}"
      ACCEPT_EULA: "Y"
    restart: unless-stopped
    # 1433 disariya publish EDILMEZ; servisler ayni docker agindan erisir.
    # Yerelde SSMS ile baglanmak icin: docker compose port sqlserver 1433
    expose:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - kargo-network

  rabbitmq:
    image: rabbitmq:management
    restart: unless-stopped
    # AMQP ve management arayuzu disariya publish EDILMEZ.
    # Management UI icin: docker compose exec ile veya gecici port-forward.
    expose:
      - "5672"
      - "15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kargo-network

  auth-service:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Semayi yalnizca bu servis uygular; digerleri hazir olmasini bekler.
      - Database__RunMigrations=true
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=KargoTakipDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryInHours=${JWT_EXPIRY_HOURS}
    depends_on:
      - sqlserver
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kargo-network

  order-service:
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=KargoTakipDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryInHours=${JWT_EXPIRY_HOURS}
      - RabbitMQ__HostName=rabbitmq
      - VehicleService__BaseUrl=http://vehicle-service:8080
    depends_on:
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_started
      vehicle-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kargo-network

  vehicle-service:
    build:
      context: .
      dockerfile: VehicleService/Dockerfile
    restart: unless-stopped
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=KargoTakipDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryInHours=${JWT_EXPIRY_HOURS}
    depends_on:
      auth-service:
        condition: service_healthy
      sqlserver:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kargo-network

  notification-service:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    restart: unless-stopped
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=KargoTakipDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryInHours=${JWT_EXPIRY_HOURS}
      - RabbitMQ__HostName=rabbitmq
      - App__PublicUrl=${APP_PUBLIC_URL-http://localhost:3000}
      - EmailSettings__FromEmail=${EMAIL_FROM_EMAIL}
      - EmailSettings__FromName=${EMAIL_FROM_NAME}
      - EmailSettings__SmtpHost=${EMAIL_SMTP_HOST}
      - EmailSettings__SmtpPort=${EMAIL_SMTP_PORT}
      - EmailSettings__Password=${EMAIL_PASSWORD}
    depends_on:
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kargo-network

  report-service:
    build:
      context: .
      dockerfile: ReportService/Dockerfile
    restart: unless-stopped
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=KargoTakipDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryInHours=${JWT_EXPIRY_HOURS}
    depends_on:
      auth-service:
        condition: service_healthy
      sqlserver:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kargo-network

  consolidation-service:
    build:
      context: .
      dockerfile: ConsolidationService/Dockerfile
    restart: unless-stopped
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=KargoTakipDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryInHours=${JWT_EXPIRY_HOURS}
      - RabbitMQ__HostName=rabbitmq
      - Consolidation__OccupancyThreshold=${CONSOLIDATION_OCCUPANCY_THRESHOLD}
      - Consolidation__MaxWaitHours=${CONSOLIDATION_MAX_WAIT_HOURS}
      - Consolidation__CheckIntervalMinutes=${CONSOLIDATION_CHECK_INTERVAL_MINUTES}
    depends_on:
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kargo-network
   
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Bos birakilir: nginx ayni origin uzerinden proxy'ledigi icin
        # istekler goreli yola gider.
        REACT_APP_API_BASE: "${REACT_APP_API_BASE-}"
    restart: unless-stopped
    ports:
      - "3000:8080"
    networks:
      - kargo-network


  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - dashboard
      - auth-service
      - order-service
      - vehicle-service
      - notification-service
      - report-service
      - consolidation-service
    restart: unless-stopped
    networks:
      - kargo-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - kargo-network
    depends_on:
      - nginx

  # DIKKAT: Quick Tunnel rastgele bir public trycloudflare.com adresi uretir ve
  # tum sistemi kimlik dogrulamasiz internete acar. Varsayilan olarak baslatilmaz.
  # Gerekirse: docker compose --profile quick-tunnel up -d
  # Kalici cozum: named tunnel (asagidaki cloudflared) + Cloudflare Access.
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    profiles: ["quick-tunnel"]
    command: tunnel --url http://nginx:80 --no-autoupdate
    restart: unless-stopped
    networks:
      - kargo-network
    depends_on:
      - nginx

  # Sadece quick tunnel ile birlikte anlamlidir. docker.sock mount'u bu konteynere
  # host uzerinde root yetkisi verir; bu yuzden yalnizca profil ile calistirilir.
  vps-updater:
    build:
      context: .
      dockerfile: Dockerfile.updater
    profiles: ["quick-tunnel"]
    container_name: kargotakip-vps-updater
    restart: unless-stopped
    environment:
      - VPS_API_URL=${VPS_API_URL}
      - UPDATER_SECRET=${UPDATER_SECRET}
    # Konteyner root degil; docker.sock'a erisim icin host'taki docker
    # grubunun GID'si gerekir: `stat -c %g /var/run/docker.sock`
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tunnel_log.txt:/app/tunnel_log.txt
    depends_on:
      - cloudflared-quick

networks:
  kargo-network:
    driver: bridge

volumes:
  sqlserver_data: