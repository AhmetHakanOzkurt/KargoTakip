sonar.projectKey=AhmetHakanOzkurt_KargoTakip
sonar.organization=ahmethakanozkurt

# NOT: Bu dosya yalnizca CI uzerinden calistirilan scanner icindir.
# Otomatik analiz .sonarcloud.properties dosyasini okur.
#
# EF Core migration dosyalari otomatik uretilir. Her migration'in
# Designer.cs dosyasi ve model snapshot'i modelin tam kopyasini icerir
# (~900 satir), bu yuzden kopya kod orani yapay olarak yuksek cikiyordu
# (Infrastructure'da %43.9). Bu dosyalar elle duzenlenmedigi icin
# kopya kod analizi disinda tutulur; kural analizi devam eder.
sonar.cpd.exclusions=**/Migrations/**

# Uretilen dosyalar kapsam metriklerini de saptiriyordu.
sonar.coverage.exclusions=**/Migrations/**,**/Program.cs
