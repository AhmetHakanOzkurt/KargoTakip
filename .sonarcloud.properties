# SonarCloud Automatic Analysis bu dosyayi okur; sonar-project.properties
# yalnizca CI uzerinden calistirilan scanner icin gecerlidir.
#
# EF Core'un urettigi migration Designer.cs dosyalari ve model snapshot'i
# modelin tam kopyasini icerir (~900 satir/dosya) ve elle duzenlenmez.
# Kopya kod analizi disinda birakilir; kural analizi aynen devam eder.
sonar.cpd.exclusions=**/Migrations/**
